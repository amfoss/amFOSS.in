name: "Bug report"
description: Create a report to help us improve the web project.
title: "[Bug]: "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        - Before creating an issue, please search the existing issues to see if a similar one already exists.
        - You can search issues using labels or keywords in the issue search bar.

  - type: textarea
    attributes:
      label: Summary
      description: Briefly describe the bug and what you expected to happen.
      placeholder: The submit button does not respond on the login page.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Go to the homepage
        2. Click on Login
        3. Enter valid credentials
        4. Click Submit
        5. Observe the issue
    validations:
      required: true

  - type: textarea
    attributes:
      label: Expected behaviour
      placeholder: User should be logged in and redirected to the dashboard.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Actual behaviour
      placeholder: Nothing happens when clicking submit.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        ## Environment information

  - type: input
    attributes:
      label: Affected page / URL
      placeholder: https://example.com/login
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Edge
        - Safari
        - Brave
        - Other
    validations:
      required: true

  - type: input
    attributes:
      label: Operating system
      placeholder: Ubuntu 22.04 / Windows 11 / macOS Sonoma
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Device type
      options:
        - Desktop
        - Laptop
        - Tablet
        - Mobile
    validations:
      required: true

  - type: textarea
    attributes:
      label: Console errors / logs
      description: Paste browser console errors (DevTools → Console).

  - type: textarea
    attributes:
      label: Screenshots / screen recordings

  - type: dropdown
    attributes:
      label: Would you like to work on this issue?
      options:
        - "Yes"
        - Prefer not
